version: '3.8'

services:
  # --- DATABASES ---
  mysql:
    image: mysql:8.0
    container_name: etl_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MYSQL_DATABASE: etl_database
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - etl_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: etl_cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: "ETLCluster"
      CASSANDRA_AUTHENTICATOR: "PasswordAuthenticator"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - etl_network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- MESSAGE BROKER (KAFKA KRAFT) ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: etl_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://159.223.41.98:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Cấu hình Cluster ID cho KRaft Mode
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Tiết kiệm bộ nhớ JVM cho Kafka
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
    networks:
      - etl_network

  # --- VISUALIZATION ---
  grafana:
    image: grafana/grafana:latest
    container_name: etl_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - etl_network
    depends_on:
      mysql:
        condition: service_healthy

  # --- API INGESTION SERVICE (FASTAPI) ---
  etl-api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: etl_api_service
    ports:
      - "8082:80"
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "recruitment-tracking"
    networks:
      - etl_network

  # --- SPARK STREAMING WORKER ---
  etl-streaming-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: etl_streaming_worker
    depends_on:
      mysql:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "recruitment-tracking"
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_PORT: "9042"
      CASSANDRA_USER: "cassandra"
      CASSANDRA_PASSWORD: "cassandra"
      CASSANDRA_KEYSPACE: "recruitment"
      CASSANDRA_TABLE: "tracking"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "123"
      MYSQL_DATABASE: "etl_database"
      MYSQL_TARGET_TABLE: "events"
    networks:
      - etl_network

networks:
  etl_network:
    driver: bridge

volumes:
  mysql_data:
  cassandra_data:
  grafana_data:
